name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # windows-latest ships the Android SDK (ANDROID_HOME) with cmdline-tools; add the platform and build tools this
      # project compiles against (compileSdk 37 = package platforms;android-37.0).
      - name: Set up Android SDK
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw 'Android SDK not found on the runner' }
          $sdkmanager = Get-ChildItem "$sdk\cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          if (-not $sdkmanager) { throw 'sdkmanager not found' }
          "y`n" * 30 | & $sdkmanager.FullName --licenses | Out-Null
          & $sdkmanager.FullName 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' | Out-Null
          if (-not (Test-Path "$sdk\platforms\android-37.0")) { throw 'platforms;android-37.0 did not install' }
          "sdk.dir=$($sdk -replace '\\','/')" | Set-Content -Path local.properties -Encoding ascii

      # Optional: sign the APK with your own key. Add two repository secrets: BUDDYVERSE_KEYSTORE_B64 (the .jks file,
      # base64) and BUDDYVERSE_KEYSTORE_PASSWORD. Without them the APK is signed with the runner's debug key.
      - name: Release signing (optional)
        env:
          KS_B64: ${{ secrets.BUDDYVERSE_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.BUDDYVERSE_KEYSTORE_PASSWORD }}
        run: |
          if (-not $env:KS_B64) { 'no signing secrets: debug-signed APK'; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force $dir | Out-Null
          [IO.File]::WriteAllBytes("$dir\release.jks", [Convert]::FromBase64String($env:KS_B64))
          "storeFile=release.jks`nstorePassword=$env:KS_PW`nkeyAlias=buddyverse`nkeyPassword=$env:KS_PW" | Set-Content "$dir\keystore.properties" -Encoding ascii
          "BUDDYVERSE_KEYSTORE=$dir\keystore.properties" | Add-Content -Path $env:GITHUB_ENV

      - name: Test and build (PC, Android, web)
        run: ./gradlew.bat --no-daemon --stacktrace :shared:desktopTest :androidApp:assembleRelease :desktopApp:packageExe

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem desktopApp/build/compose/binaries/main/exe -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'no installer was built' }
          Copy-Item $exe.FullName out/Buddyverse-Setup.exe
          $apk = Get-ChildItem androidApp/build/outputs/apk/release -Filter *.apk | Select-Object -First 1
          if (-not $apk) { throw 'no APK was built' }
          Copy-Item $apk.FullName out/Buddyverse.apk
          Compress-Archive -Path shared/build/hermes-plugin/* -DestinationPath out/Buddyverse-web.zip
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Buddyverse
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  # The "clean machine" test: a fresh runner installs the built exe per-user, runs the headless first-run setup
  # (which installs Hermes with its official installer and creates the login) and signs in to the local gateway.
  clean-install:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Buddyverse
          path: dl

      - name: Install per-user (silent)
        run: |
          $p = Start-Process -FilePath (Resolve-Path dl/Buddyverse-Setup.exe) -ArgumentList '/quiet' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          $exe = "$env:LOCALAPPDATA\Buddyverse\Buddyverse.exe"
          if (-not (Test-Path $exe)) {
            $found = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter Buddyverse.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) { throw 'Buddyverse.exe not found under LOCALAPPDATA after install' }
            $exe = $found.FullName
          }
          "installed: $exe"
          "BUDDYVERSE_EXE=$exe" | Add-Content -Path $env:GITHUB_ENV

      - name: Headless setup
        run: |
          $user = 'ci' + (Get-Random -Minimum 1000 -Maximum 9999)
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $pass = [Convert]::ToBase64String($bytes) -replace '[+/=]', 'x'
          "::add-mask::$pass"
          $pw = Join-Path $env:RUNNER_TEMP 'pw.txt'
          Set-Content -Path $pw -Value $pass -Encoding utf8     # with a trailing newline: setup reads the first line only
          "BV_USER=$user" | Add-Content -Path $env:GITHUB_ENV
          "BV_PASS=$pass" | Add-Content -Path $env:GITHUB_ENV
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $p = Start-Process -FilePath $env:BUDDYVERSE_EXE `
            -ArgumentList @('--setup', '--username', $user, '--password-file', "`"$pw`"", '--skip-phone') `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru
          $null = $p.Handle   # keeps the exit code
          if (-not $p.WaitForExit(2400000)) { $p.Kill(); Get-Content $log, "$log.err" -ErrorAction SilentlyContinue; throw 'setup took longer than 40 minutes' }
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
          Remove-Item $pw
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }

      - name: Login is stored as a hash only, and works on the gateway
        run: |
          $envText = Get-Content "$env:LOCALAPPDATA\hermes\.env" -Raw
          if ($envText -notmatch 'HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH=') { throw 'no password hash in .env' }
          if ($envText -match '(?m)^HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=') { throw 'plaintext password in .env' }
          if ($envText.Contains($env:BV_PASS)) { throw 'the password itself is in .env' }
          if (Test-Path "$env:LOCALAPPDATA\hermes\webapp-login.txt") { throw 'a plaintext login file was written' }
          $r = Invoke-WebRequest 'http://127.0.0.1:9120/api/status' -UseBasicParsing -TimeoutSec 10
          "gateway: HTTP $($r.StatusCode)"
          # A second run resumes and re-checks; a wrong password for the existing login must exit 3.
          $bad = Join-Path $env:RUNNER_TEMP 'bad.txt'
          Set-Content -Path $bad -Value 'wrong-password-123' -Encoding utf8
          $p = Start-Process -FilePath $env:BUDDYVERSE_EXE -ArgumentList @('--setup', '--password-file', "`"$bad`"", '--skip-phone') -PassThru
          $null = $p.Handle; $p.WaitForExit()
          Remove-Item $bad
          if ($p.ExitCode -ne 3) { throw "wrong password: expected exit 3, got $($p.ExitCode)" }
          'wrong password refused (exit 3)'

      - name: Installed files
        if: always()
        run: |
          foreach ($f in "$env:LOCALAPPDATA\hermes\bin\hermes.exe", "$env:LOCALAPPDATA\hermes\plugins\buddyverse\dashboard\index.html",
                         "$env:USERPROFILE\buddyverse\bin\start-hermes.ps1", "$env:USERPROFILE\buddyverse\brain\index.md") {
            "$(Test-Path $f)  $f"
          }
